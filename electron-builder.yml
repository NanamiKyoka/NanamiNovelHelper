appId: com.nanami.novel-helper
productName: 七海小说助手
copyright: Copyright © 2024 NanamiNovelHelper Team

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - node_modules/**/*
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!docs/*'
  - '!node_modules/*/{CHANGELOG.md,README.md,readme.md,readme,LICENSE,license,LICENSE.md,license.md}'
  - '!node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
  - '!node_modules/.bin'
  - '!node_modules/*/node_modules/.bin'

# 启用 ASAR 打包，减少体积和提升启动速度
asar: true

# 需要解压的文件（原生模块需要真实文件路径）
asarUnpack:
  - resources/**
  - node_modules/sharp/**
  - node_modules/node-pty/**
  - node_modules/@electron/**
  - node_modules/better-sqlite3/**

# 最大压缩
compression: maximum

# 构建钩子
afterPack: ./scripts/fix-deps.js

# 跳过原生模块重建，使用预编译版本
npmRebuild: false

win:
  icon: resources/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}

mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  icon: resources/icon.png
  target:
    - AppImage
    - snap
    - deb
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: Office
  maintainer: electronjs.org

publish:
  provider: github
  owner: nanami-novel-helper
  repo: nanami-novel-helper
