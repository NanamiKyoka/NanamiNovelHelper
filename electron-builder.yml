appId: com.nanami.novel-helper
productName: 七海小说助手
copyright: Copyright © 2024 NanamiNovelHelper Team

directories:
  buildResources: resources
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!docs/*'

asarUnpack:
  - resources/**

win:
  icon: resources/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}

mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  icon: resources/icon.png
  target:
    - AppImage
    - snap
    - deb
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: Office
  maintainer: electronjs.org

publish:
  provider: github
  owner: nanami-novel-helper
  repo: nanami-novel-helper
