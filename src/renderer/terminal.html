<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ipc.localhost: http://ipc.localhost https://tauri.localhost; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: local: blob:; font-src 'self' data:;">
    <title>终端 - NanamiNovelHelper</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background-color: #1e1e1e;
      }
      #root {
        height: 100%;
      }
      #splash-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 24px;
      }
      .splash-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(24, 144, 255, 0.3);
        border-top-color: #1890ff;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      .splash-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: 0.5px;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body oncontextmenu="return false">
    <div id="root">
      <div id="splash-screen">
        <div class="splash-spinner"></div>
        <div class="splash-text">终端</div>
      </div>
    </div>
    <script type="module" src="./terminal-main.tsx"></script>
  </body>
</html>
