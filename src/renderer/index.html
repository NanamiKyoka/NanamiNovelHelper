<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ipc.localhost: http://ipc.localhost https://tauri.localhost; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: local:; font-src 'self' data:;" />
    <title>NanamiNovelHelper</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background-color: #f0f2f5;
      }
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #1e1e1e;
        }
      }
      #root {
        height: 100%;
      }
      #splash-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 24px;
        transition: opacity 0.3s ease;
      }
      #splash-screen.fade-out {
        opacity: 0;
      }
      .splash-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(24, 144, 255, 0.2);
        border-top-color: #1890ff;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        .splash-spinner {
          border-color: rgba(24, 144, 255, 0.3);
          border-top-color: #1890ff;
        }
      }
      .splash-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        color: rgba(0, 0, 0, 0.45);
        letter-spacing: 0.5px;
      }
      @media (prefers-color-scheme: dark) {
        .splash-text {
          color: rgba(255, 255, 255, 0.45);
        }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash-screen">
        <div class="splash-spinner"></div>
        <div class="splash-text">NanamiNovelHelper</div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
