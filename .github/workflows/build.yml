name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.changelog.outputs.body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          CURRENT_TAG=${{ github.ref_name }}

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          echo "Generating changelog from ${PREV_TAG:-initial commit} to ${CURRENT_TAG}"

          BODY="## ${CURRENT_TAG}\n\n"

          FEAT=$(git log ${RANGE} --format="- %s" --grep="^feat")
          FIX=$(git log ${RANGE} --format="- %s" --grep="^fix")
          REFACTOR=$(git log ${RANGE} --format="- %s" --grep="^refactor")
          DOCS=$(git log ${RANGE} --format="- %s" --grep="^docs")
          TEST=$(git log ${RANGE} --format="- %s" --grep="^test")
          CHORE=$(git log ${RANGE} --format="- %s" --grep="^chore")
          OTHER=$(git log ${RANGE} --format="- %s" --grep="^feat" --invert-grep --grep="^fix" --invert-grep --grep="^refactor" --invert-grep --grep="^docs" --invert-grep --grep="^test" --invert-grep --grep="^chore" --invert-grep)

          if [ -n "$FEAT" ]; then BODY="${BODY}### ✨ 新功能\n${FEAT}\n\n"; fi
          if [ -n "$FIX" ]; then BODY="${BODY}### 🐛 修复\n${FIX}\n\n"; fi
          if [ -n "$REFACTOR" ]; then BODY="${BODY}### ♻️ 重构\n${REFACTOR}\n\n"; fi
          if [ -n "$DOCS" ]; then BODY="${BODY}### 📝 文档\n${DOCS}\n\n"; fi
          if [ -n "$TEST" ]; then BODY="${BODY}### 🧪 测试\n${TEST}\n\n"; fi
          if [ -n "$CHORE" ]; then BODY="${BODY}### 🔧 构建/工具\n${CHORE}\n\n"; fi
          if [ -n "$OTHER" ]; then BODY="${BODY}### 📦 其他\n${OTHER}\n\n"; fi

          BODY="${BODY}---\n**完整提交记录**: [${PREV_TAG:-initial}...${CURRENT_TAG}](https://github.com/${{ github.repository }}/compare/${PREV_TAG:-${CURRENT_TAG}}...${CURRENT_TAG})"

          {
            echo "body<<EOF"
            echo -e "${BODY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: generate-changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    name: Build on ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NanamiNovelHelper ${{ github.ref_name }}'
          releaseBody: ${{ needs.generate-changelog.outputs.release_body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
